# telemanom_nasa_config.yaml
# Test configuration for Telemanom integration on NASA dataset
base_dir: "./datasets"           
exp_dir: "experiments_telemanom"
dataset: "nasa"               
model: "telemanom"
feature_extractor: "none"
use_telecommands: False
segmentator: false
detector: none
n_predictions: 10

base_classifier_params:
  criterion: MSELoss
  optimizer: Adam
  n_predictions: 10
  reduce_out: mean
  epochs: 35
  p: 0.13
  patience: 10