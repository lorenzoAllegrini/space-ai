# ocsvm_esa_sweep_config.yaml
# Sweep OCSVM in comparazione diretta con DPMM

base_dir: "./datasets"           
exp_dir: "experiments"
dataset: "esa"               
mission_id: 1
model: "pyod_ocsvm"
detector: "threshold"
segmentator: false
challenge: false
save_metadata: false

detector_params:
  threshold: [0.9, 0.95, 0.97, 1.0]
  quantile: null
  smoothing_alpha: [0.1, 0.3, 0.4, 1.0]

eval_perc: 0.4
filter_valid: true

# Feature Extraction
feature_extractor: 
  - "base_statistics"

feature_extraction_params:
  max_features: 5
  selected_features: null
  
window_size: null
step_size: null
max_window: 500
min_window: 150
perc_step_size: 0.5

channels: null

base_classifier_params:
  return_proba: true
  dynamic_scaling: [true, false]
  scaler_window: 1000
  cache_size: 500
  kernel: ['rbf', 'sigmoid']
  nu: [0.01, 0.1, 0.5]
  gamma: ['scale', 'auto']
