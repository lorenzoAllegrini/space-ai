# iforest_esa_sensitive.yaml
# Profilo: Alta Sensibilità (Aggressivo)
base_dir: "./datasets"           
exp_dir: "experiments_iforest_sensitive"
dataset: "esa"               
mission_id: 1
model: "iforest"
detector: "threshold"

window_size: 100
step_size: 50
perc_step_size: 0.5

feature_extractor: "base_statistics"
feature_extraction_params:
  max_features: 10

channels: ["channel_41", "channel_42", "channel_43", "channel_44", "channel_45", "channel_46"]

base_classifier_params:
  n_estimators: 100
  contamination: 0.1
  max_samples: "auto"
  max_features: 0.8
  bootstrap: true
  random_state: 42
  
detector_params:
  threshold: 0.95
