# iforest_esa_config.yaml
# Configurazione per Isolation Forest su ESA tramite SML Server

base_dir: "./datasets"           
exp_dir: "experiments"
dataset: "esa"               
mission_id: 1
model: "iforest"
detector: "threshold"
segmentator: false

detector_params:
  quantile: 2000.0
  smoothing_alpha: 0.2

eval_perc: 0.4
filter_valid: true

# Feature Extraction: iForest lavora meglio su statistiche aggregate
feature_extractor:    
  - "base_statistics"

feature_extraction_params:
  max_features: 5
  selected_features: null
  
window_size: null
step_size: null
max_window: 500
min_window: 150
perc_step_size: 0.5

channels: null

base_classifier_params:
  dynamic_scaling: true
  scaler_window: 1000
  n_estimators: 100
  contamination: 0.001
  max_samples: "auto"
  random_state: 42
