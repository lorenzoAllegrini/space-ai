# telemanom_esa_full_config.yaml
# Adapted from ESN legacy configuration

base_dir: "./datasets"           
exp_dir: "experiments_telemanom_full"
dataset: "esa"               
mission_id: 1
model: "telemanom"
feature_extractor: "none"
use_telecommands: False

# Using 'l_s' (250) as the primary window/context size
window_size: 250
step_size: 250

channels:
  - "channel_41"
  - "channel_42"
  - "channel_43"
  - "channel_44"
  - "channel_45"
  - "channel_46"

base_classifier_params:
  # Architecture
  input_size: 1
  hidden_sizes: [80, 80]
  n_predictions: 10
  dropout: 0.3
  
  # Training
  epochs: 15
  batch_size: 64
  perc_eval: null
  lr: 0.001
  patience: 5
  min_delta: 0.0003
  
  # Telemanom Detector Params
  pruning_factor: 0.13    # mapped from 'p'
  error_offset: 100       # mapped from 'error_buffer'
  smoothing_perc: 0.05
  n_eval_per_window: 70   # mapped from 'batch_size' in snippet
  telemanom_window_size: 2100
