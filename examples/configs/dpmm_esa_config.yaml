# dpmm_unit_segmentation_config.yaml
# Configurazione per esperimenti non-continual (run_segment_extraction_exp.py)

base_dir: "./datasets"           
exp_dir: "experiments"
dataset: "esa"               
mission_id: 1
model: "dpmm"
dpmm_type: "unit"            
dpmm_mode: "likelihood_threshold"
detector: "molookde"
segmentator: false
feature_extractor: "base_statistics"
window_size: null
step_size: null
max_window: 500
min_window: 100
perc_step_size: 0.5

channels: 
  - "channel_41"
  - "channel_42"
  - "channel_43"
  - "channel_44"
  - "channel_45"
  - "channel_46"

base_classifier_params:
  #dynamic_scaling: true
  #scaler_window: 672
  n_clusters: 100
  num_iterations: 100
  lr: 0.5
  alpha_dp: 3.0
  var_prior: 3.0
  var_prior_strength: 1.0
  mu_prior_strength: 0.001
  quantile: 0.001
  return_likelihood: true

detector_params:
  alpha: 0.001
  p: 3.0
  unitize: true
  pot_percentile: 97.0
  smoothing_alpha: 0.2
  min_allowed_ll: -200.0
