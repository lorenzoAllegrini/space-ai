# dpmm_nasa_feature_sweep_config.yaml
# Sweep for DPMM experiments on NASA varying only the features extracted

base_dir: "./datasets"           
exp_dir: "experiments"
dataset: "nasa"               
mission_id: 1                  
model: "dpmm"
dpmm_type: "unit"            
dpmm_mode: "likelihood_threshold"

# --- Fixed Parameters ---
challenge: false
detector: "dpmm_native"  # Uso il detector nativo che abbiamo appena creato
feature_extractor: "base_statistics"

perc_eval: 0.2
window_size: null         # Finestra tipica per i segnali NASA
step_size: null
max_window: 300
min_window: 150
perc_step_size: 0.5

base_classifier_params:
  #dynamic_scaling: true
  #scaler_window: 100
  n_clusters: 10
  num_iterations: 1000
  patience: 100
  min_delta: 0.001
  restore_best: true
  lr: 0.1
  alpha_dp: 3.0
  var_prior: 3.0
  var_prior_strength: 0.001
  mu_prior_strength: 0.001
  quantile: 0.0001

detector_params: {}

feature_extraction_params:
  max_features: null
  selected_features: 
